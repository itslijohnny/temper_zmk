# Uncomment the following line to enable deep sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_DISPLAY_INVERT=y
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20
# Bluetooth tweaks
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=9

# # TPS43 Trackpad (IQS5XX) Configuration
# CONFIG_INPUT=y
# CONFIG_INPUT_AZOTEQ_IQS5XX=y
# CONFIG_ZMK_INPUT_LISTENER=y
# CONFIG_ZMK_MOUSE=y
# CONFIG_ZMK_POINTING=y
# Temper Right Side Configuration - 2 PIN I2C TPS43 Trackpad
# File: temper_right.conf or config/temper.conf

# ======================================
# GPIO-based I2C (Bit-Banged I2C)
# ======================================
# This is CRITICAL - enable software I2C driver
CONFIG_I2C=y
CONFIG_I2C_GPIO=y

# Disable hardware I2C if it conflicts
# CONFIG_I2C_NRFX=n

# ======================================
# Input Subsystem & Mouse
# ======================================
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y

# ======================================
# Debug Logging (ENABLE for troubleshooting)
# ======================================
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# I2C and driver logging
CONFIG_I2C_LOG_LEVEL_DBG=y
CONFIG_IQS5XX_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_DBG=y
CONFIG_ZMK_MOUSE_LOG_LEVEL_DBG=y

# GPIO logging
CONFIG_GPIO_LOG_LEVEL_DBG=y

# ======================================
# After it works, disable logging to save power:
# ======================================
# CONFIG_LOG=n
# (Remove all LOG_LEVEL_DBG lines)

# ======================================
# Bluetooth Optimization (Optional)
# ======================================
# Uncomment these if mouse movement is laggy over Bluetooth
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ======================================
# Power Management (Optional)
# ======================================
