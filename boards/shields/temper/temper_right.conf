# Temper Right Side Configuration - TPS43 Trackpad

# ======================================
# I2C Configuration
# ======================================
# CONFIG_I2C=y

# ======================================
# Input Subsystem & Mouse
# ======================================
# CONFIG_INPUT=y
# CONFIG_INPUT_AZOTEQ_IQS5XX=y
# CONFIG_ZMK_MOUSE=y
# CONFIG_ZMK_POINTING=y

# ======================================
# CRITICAL: ENABLE ALL LOGGING
# ======================================
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Set log buffer and processing
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# ======================================
# MAXIMUM DEBUG LOGGING - ALL SUBSYSTEMS
# ======================================

# I2C logging
CONFIG_I2C_LOG_LEVEL_DBG=y

# IQS5XX driver logging
CONFIG_IQS5XX_LOG_LEVEL_DBG=y

# Input subsystem logging
CONFIG_INPUT_LOG_LEVEL_DBG=y

# ZMK mouse logging
CONFIG_ZMK_MOUSE_LOG_LEVEL_DBG=y

# GPIO logging
CONFIG_GPIO_LOG_LEVEL_DBG=y

# Device initialization logging
CONFIG_DEVICE_LOG_LEVEL_DBG=y

# Kernel logging
CONFIG_KERNEL_LOG_LEVEL_DBG=y

# ======================================
# Additional Debug Options
# ======================================

# Show all printk messages
CONFIG_LOG_PRINTK=y

# Early console (shows boot messages)
CONFIG_EARLY_CONSOLE=y

# Assert on errors
CONFIG_ASSERT=y
CONFIG_ASSERT_VERBOSE=y

# ======================================
# Bluetooth Optimization (Optional)
# ======================================
# Uncomment if you want to see Bluetooth logs too
# CONFIG_BT_DEBUG_LOG=y
# CONFIG_BT_LOG_LEVEL_DBG=y

# ======================================
# NOTES FOR DEBUGGING
# ======================================
# After flashing this configuration:
# 1. Connect to serial console (see instructions below)
# 2. Look for these key messages:
#    - "i2c@40003000" or "i2c0" initialization
#    - "Device found at address 0x74" (SUCCESS!)
#    - "Failed to read" or "I2C timeout" (FAILURE)
# 3. Share the output if you need help
#
# Once working, comment out all LOG settings to save power!