# Temper Right Side Configuration - TPS43 Trackpad

# ======================================
# I2C Configuration
# ======================================
CONFIG_I2C=y

# ======================================
# Input Subsystem & Mouse
# ======================================
CONFIG_INPUT=y
CONFIG_INPUT_AZOTEQ_IQS5XX=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y

# ======================================
# Debug Logging (ENABLE for troubleshooting)
# ======================================
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_RTT_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# I2C and driver logging
CONFIG_I2C_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_DBG=y
CONFIG_GPIO_LOG_LEVEL_DBG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

# ======================================
# After it works, disable logging to save power:
# ======================================
# CONFIG_LOG=n
# (Remove all LOG_LEVEL_DBG lines)

# ======================================
# Bluetooth Optimization (Optional)
# ======================================
# Uncomment these if mouse movement is laggy over Bluetooth
# CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
# CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ======================================
# Power Management (Optional)
# ======================================
# CONFIG_PM=y
# CONFIG_PM_DEVICE=y
